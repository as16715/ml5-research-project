<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Object Detection - Easy Biggest Box</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #d8f6ff, #f8f2e9 60%, #f2dcd1);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    main {
      width: min(92vw, 700px);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.2rem, 2.7vw, 1.8rem);
      color: #213045;
    }

    p {
      margin: 0 0 16px;
      color: #334865;
    }

    canvas {
      width: 100% !important;
      height: auto !important;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(16, 25, 45, 0.16);
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .nav-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-btn {
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(33, 48, 69, 0.2);
      color: #213045;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .nav-btn.secondary {
      background: rgba(223, 240, 255, 0.9);
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <a class="nav-btn" href="../index.html">Back to Hub</a>
      <div class="nav-group">
        <a class="nav-btn" href="https://docs.ml5js.org/#/reference/object-detection" target="_blank" rel="noreferrer">ml5 Docs</a>
        <a class="nav-btn secondary" href="./README.md">Project README</a>
      </div>
    </div>
    <h1>Easy Object Detection: Biggest Box</h1>
    <p>The largest detected object gets a bold spotlight box. Move items closer to camera and watch it switch.</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <script>
    let video;
    let detector;
    let detections = [];
    let modelReady = false;

    function setup() {
      const canvas = createCanvas(640, 480);
      canvas.parent(document.querySelector("main"));

      video = createCapture(VIDEO, { flipped: true });
      video.size(width, height);
      video.hide();

      detector = ml5.objectDetection("cocossd", () => {
        modelReady = true;
        detector.detectStart(video, gotDetections);
      });

      textFont("Trebuchet MS");
    }

    function gotDetections(results) {
      detections = results || [];
    }

    function draw() {
      background(20);
      image(video, 0, 0, width, height);

      if (!modelReady) {
        fill(0, 160);
        rect(0, 0, width, height);
        fill(255);
        textAlign(CENTER, CENTER);
        textSize(24);
        text("Loading COCO-SSD...", width / 2, height / 2);
        return;
      }

      let biggest = null;
      let biggestArea = 0;

      for (const item of detections) {
        const area = item.width * item.height;
        if (area > biggestArea) {
          biggestArea = area;
          biggest = item;
        }

        stroke(70, 220, 255, 180);
        strokeWeight(1.5);
        noFill();
        rect(item.x, item.y, item.width, item.height);
      }

      if (biggest) {
        stroke(255, 190, 70);
        strokeWeight(4);
        noFill();
        rect(biggest.x, biggest.y, biggest.width, biggest.height);

        fill(0, 170);
        noStroke();
        rect(0, height - 78, width, 78);

        fill(255);
        textAlign(LEFT, CENTER);
        textSize(18);
        text(`Largest object: ${biggest.label}`, 18, height - 48);
        textSize(14);
        text(`Total detections: ${detections.length}`, 18, height - 24);
      }
    }
  </script>
</body>
</html>
