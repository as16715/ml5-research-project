<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feature Extractor - Easy Two-Class Trainer</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(125deg, #efe4ff, #dcf2ec);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #2a2848;
    }

    main {
      width: min(92vw, 760px);
      text-align: center;
      background: rgba(255, 255, 255, 0.73);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 18px 42px rgba(25, 20, 55, 0.15);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.2rem, 2.7vw, 1.9rem);
    }

    p {
      margin: 0 0 12px;
      color: #4d4b6e;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 10px 0 12px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
    }

    .a { background: #5f6ee8; }
    .b { background: #e05e8d; }
    .train { background: #2f8168; }
    .reset { background: #6b7489; }

    canvas {
      width: 100% !important;
      height: auto !important;
      border-radius: 14px;
      box-shadow: 0 16px 35px rgba(16, 18, 40, 0.16);
    }

    .status {
      margin-top: 10px;
      font-weight: 700;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .nav-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-btn {
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(42, 40, 72, 0.2);
      color: #2a2848;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .nav-btn.secondary {
      background: rgba(229, 239, 255, 0.9);
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <a class="nav-btn" href="../index.html">Back to Hub</a>
      <div class="nav-group">
        <a class="nav-btn" href="https://docs.ml5js.org/#/reference/image-classifier-tm" target="_blank" rel="noreferrer">ml5 Docs</a>
        <a class="nav-btn secondary" href="https://github.com/as16715/ml5-research-project/tree/main/FeatureExtractor" target="_blank" rel="noreferrer">Project README</a>
      </div>
    </div>
    <h1>Easy Feature Extractor: Two-Class Trainer</h1>
    <p>Record samples for class A and B, train, then watch live predictions from your webcam.</p>
    <div class="controls">
      <button class="a" id="addA">Add A Sample</button>
      <button class="b" id="addB">Add B Sample</button>
      <button class="train" id="trainBtn">Train</button>
      <button class="reset" id="resetBtn">Reset</button>
    </div>
    <div class="status" id="statusText">Loading feature extractor...</div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <script>
    let video;
    let featureExtractor;
    let classifier;
    let modelReady = false;
    let isClassifying = false;
    let label = "-";
    let confidence = 0;

    let countA = 0;
    let countB = 0;

    const addA = document.getElementById("addA");
    const addB = document.getElementById("addB");
    const trainBtn = document.getElementById("trainBtn");
    const resetBtn = document.getElementById("resetBtn");
    const statusText = document.getElementById("statusText");

    addA.disabled = true;
    addB.disabled = true;
    trainBtn.disabled = true;
    resetBtn.disabled = true;

    function setup() {
      const canvas = createCanvas(640, 420);
      canvas.parent(document.querySelector("main"));

      if (!window.isSecureContext) {
        statusText.textContent = "Camera models need https or localhost.";
      }

      video = createCapture(VIDEO, { flipped: true });
      video.size(width, height);
      video.hide();

      featureExtractor = ml5.featureExtractor("MobileNet", () => {
        modelReady = true;
        statusText.textContent = "Ready. Add samples for A and B.";
        addA.disabled = false;
        addB.disabled = false;
        trainBtn.disabled = false;
        resetBtn.disabled = false;
      });

      classifier = featureExtractor.classification(video);

      setTimeout(() => {
        if (!modelReady) {
          statusText.textContent = "Still loading feature extractor. Check network and reload.";
        }
      }, 15000);

      addA.addEventListener("click", () => addSample("A"));
      addB.addEventListener("click", () => addSample("B"));
      trainBtn.addEventListener("click", trainModel);
      resetBtn.addEventListener("click", resetAll);

      textFont("Trebuchet MS");
    }

    function addSample(className) {
      if (!modelReady) {
        return;
      }
      classifier.addImage(className);
      if (className === "A") {
        countA += 1;
      } else {
        countB += 1;
      }
      statusText.textContent = `Samples - A: ${countA} | B: ${countB}`;
    }

    function trainModel() {
      if (!modelReady || (countA === 0 || countB === 0)) {
        statusText.textContent = "Add at least one sample for both A and B.";
        return;
      }

      statusText.textContent = "Training...";
      classifier.train((loss) => {
        if (loss === null) {
          statusText.textContent = "Training done. Classifying live...";
          isClassifying = true;
          classifier.classify(gotResult);
        } else {
          statusText.textContent = `Training loss: ${loss.toFixed(4)}`;
        }
      });
    }

    function gotResult(error, results) {
      if (error) {
        statusText.textContent = "Classification error. Train again.";
        isClassifying = false;
        return;
      }

      if (!results) {
        if (isClassifying) {
          classifier.classify(gotResult);
        }
        return;
      }

      if (Array.isArray(results)) {
        label = results[0] ? results[0].label : "-";
        confidence = results[0] ? results[0].confidence : 0;
      } else {
        label = results.label || "-";
        confidence = typeof results.confidence === "number" ? results.confidence : 0;
      }

      if (isClassifying) {
        classifier.classify(gotResult);
      }
    }

    function resetAll() {
      countA = 0;
      countB = 0;
      label = "-";
      confidence = 0;
      isClassifying = false;
      classifier = featureExtractor.classification(video);
      statusText.textContent = "Reset done. Add new A and B samples.";
    }

    function draw() {
      const tintColor = label === "A" ? [95, 110, 232] : [224, 94, 141];
      image(video, 0, 0, width, height);

      if (label !== "-") {
        fill(tintColor[0], tintColor[1], tintColor[2], 70);
        noStroke();
        rect(0, 0, width, height);
      }

      fill(0, 150);
      noStroke();
      rect(0, height - 90, width, 90);

      fill(255);
      textAlign(LEFT, CENTER);
      textSize(20);
      text(`Prediction: ${label}`, 16, height - 58);
      textSize(15);
      text(`Confidence: ${(confidence * 100).toFixed(1)}%`, 16, height - 30);
    }
  </script>
</body>
</html>
