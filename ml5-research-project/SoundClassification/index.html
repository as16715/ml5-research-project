<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound Classification - Easy Sound Color</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(120deg, #f8efdf, #d7f0ff);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    main {
      width: min(92vw, 700px);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.2rem, 2.7vw, 1.8rem);
      color: #24324d;
    }

    p {
      margin: 0 0 10px;
      color: #3a4d6c;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      background: #1f304f;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 12px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    canvas {
      width: 100% !important;
      height: auto !important;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(16, 24, 48, 0.16);
    }
  </style>
</head>
<body>
  <main>
    <h1>Easy Sound Classification: Sound Color</h1>
    <p>Press the button to enable microphone, then make sounds and watch label + confidence react.</p>
    <button id="startBtn" disabled>Loading model...</button>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <script>
    let classifier;
    let isModelReady = false;
    let started = false;
    let currentLabel = "loading model...";
    let confidence = 0;
    let heardAnyResult = false;

    const startBtn = document.getElementById("startBtn");

    const labelColors = {
      clap: [255, 125, 76],
      whistle: [90, 170, 255],
      snap: [120, 230, 130],
      bell: [255, 200, 95],
      yes: [130, 220, 130],
      no: [235, 110, 110]
    };

    function setup() {
      const canvas = createCanvas(640, 320);
      canvas.parent(document.querySelector("main"));
      textAlign(CENTER, CENTER);
      textFont("Trebuchet MS");

      classifier = ml5.soundClassifier("SpeechCommands18w", {
        probabilityThreshold: 0.15,
        overlapFactor: 0.5
      }, modelLoaded);

      setTimeout(() => {
        if (!isModelReady) {
          currentLabel = "Model still loading. Check network and reload.";
        }
      }, 15000);
    }

    function modelLoaded() {
      isModelReady = true;
      currentLabel = "Model ready - press Start Microphone";
      startBtn.disabled = false;
      startBtn.textContent = "Start Microphone";
    }

    startBtn.addEventListener("click", startListening);

    async function startListening() {
      if (!isModelReady || started) {
        if (!isModelReady) {
          currentLabel = "Model still loading...";
        }
        return;
      }

      if (!window.isSecureContext) {
        currentLabel = "Microphone needs https or localhost";
        startBtn.disabled = false;
        startBtn.textContent = "Use localhost then retry";
        return;
      }

      startBtn.disabled = true;
      startBtn.textContent = "Requesting mic permission...";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach((track) => track.stop());

        await userStartAudio();
        classifier.classify(gotSound);

        started = true;
        currentLabel = "Listening... make a clear sound";
        startBtn.textContent = "Microphone Active";

        setTimeout(() => {
          if (started && !heardAnyResult) {
            currentLabel = "Mic is on. Try clapping, saying yes/no, or whistling.";
          }
        }, 7000);
      } catch (err) {
        currentLabel = "Microphone denied/unavailable. Retry and allow access.";
        startBtn.disabled = false;
        startBtn.textContent = "Try Start Microphone Again";
      }
    }

    function gotSound(error, results) {
      if (error) {
        currentLabel = "Audio stream error. Click start to retry.";
        started = false;
        startBtn.disabled = false;
        startBtn.textContent = "Try Start Microphone Again";
        return;
      }

      if (!results || results.length === 0) {
        return;
      }

      heardAnyResult = true;
      currentLabel = results[0].label;
      confidence = results[0].confidence;
    }

    function colorFromLabel() {
      const lower = currentLabel.toLowerCase();
      for (const key in labelColors) {
        if (lower.includes(key)) {
          return labelColors[key];
        }
      }
      return [42, 55, 78];
    }

    function draw() {
      const c = colorFromLabel();
      background(c[0], c[1], c[2]);

      const pulse = map(confidence, 0, 1, 35, 140);
      const wave = 12 * sin(frameCount * 0.08);

      noFill();
      stroke(255, 210);
      strokeWeight(4);
      circle(width / 2, height / 2, pulse * 2 + wave + 20);

      stroke(255, 120);
      strokeWeight(2);
      circle(width / 2, height / 2, pulse * 2 + wave + 60);

      noStroke();
      fill(0, 120);
      rect(0, height - 98, width, 98);

      fill(255);
      textSize(24);
      text(currentLabel, width / 2, height - 62);
      textSize(16);
      text(`Confidence: ${(confidence * 100).toFixed(1)}%`, width / 2, height - 32);

      if (!started) {
        textSize(15);
        text("Start microphone with the button above", width / 2, 24);
      }
    }
  </script>
</body>
</html>
